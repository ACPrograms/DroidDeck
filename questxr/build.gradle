plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droiddeck.questxr'
    compileSdk 34
    ndkVersion project.findProperty('ndkVersion') ?: '27.3.13750724'
    defaultConfig {
        applicationId 'com.droiddeck.questxr'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static' }
        }
    }
    buildFeatures { prefab true }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
