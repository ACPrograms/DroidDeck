name: Build original DroidDeck Xbox UI host
on:
  workflow_dispatch:
  push:
    branches: [codex/xbox-adaptation]
    paths: [xbox-host/**, xbox-ui/**, tools/xbox/**, .github/workflows/xbox-host.yml]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check provisioning receipts and disk preservation
        run: dotnet run --project tools/xbox/ProvisioningChecks.csproj -c Release
      - name: Check controller protocol and guest setup syntax
        shell: bash
        run: |
          python tools/xbox/test_guest_gamepad.py -v
          bash -n tools/xbox/prepare-native-guest.sh
          bash -n tools/xbox/bootstrap-native-guest.sh
          python -c "from pathlib import Path; files = list(Path('tools/xbox').glob('*.sh')) + list(Path('tools/xbox').glob('*.py')); assert all(b'\r' not in p.read_bytes() for p in files), 'Linux executables must use LF endings'"
      - uses: actions/cache@v4
        id: native-sdk
        with:
          path: xbox-host/NativeSdk
          key: qemu-x64-${{ hashFiles('tools/xbox/native-sdk-lock.json') }}
      - name: Download pinned public native engine
        if: steps.native-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39386346738 --repo YoCanIGetUhhhh/XboxInstallOtherOS-dev --name XboxVmHost-package --dir "$env:RUNNER_TEMP/droiddeck-native-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native SDK download failed' }
          python tools/xbox/stage_qemu_sdk.py --artifact-dir "$env:RUNNER_TEMP/droiddeck-native-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native SDK verification failed' }
      - name: Verify all cached native engine assets
        run: python tools/xbox/stage_qemu_sdk.py --verify-only
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: xbox-ui/*.kts
      - uses: actions/cache@v4
        id: ui-assets
        with:
          path: xbox-ui/build/dist/wasmJs/productionExecutable
          key: ${{ runner.os }}-droiddeck-compose-${{ hashFiles('xbox-ui/**', 'app/src/main/java/**', 'app/src/main/res/**') }}
      - name: Compile original Compose sources
        if: steps.ui-assets.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./gradlew.bat -p xbox-ui wasmJsBrowserDistribution --no-daemon
      - name: Package original UI in Xbox host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force xbox-host/Assets/DroidDeckUI | Out-Null
          Copy-Item xbox-ui/build/dist/wasmJs/productionExecutable/* xbox-host/Assets/DroidDeckUI/ -Recurse -Force
          ./xbox-host/build-host.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: droiddeck-original-ui-host
          path: xbox-host/AppPackages/
          if-no-files-found: error
          retention-days: 3
